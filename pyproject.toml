[project]
name = "deep-dive-into-representation-learning"
version = "0.1.0"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "numpy",
    "matplotlib",
    "kornia>=0.8.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
]

[tool.uv]
index-strategy = "first-index"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
